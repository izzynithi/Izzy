<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ตัวดูแบบชิ้นงานเฟอร์นิเจอร์ 3 มิติ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap');

  :root{
    --bg-0:#14181c;
    --bg-1:#1b2126;
    --bg-2:#232b31;
    --line:#33404a;
    --ink:#e7edf0;
    --ink-dim:#8fa2ab;
    --accent:#e08a3c;
    --accent-dim:#a8632a;
    --blue:#4fb8d6;
    --ok:#6bc98f;
    --warn:#e0733c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg-0);color:var(--ink);
    font-family:'Sarabun',sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none;}
  #scene{position:absolute;inset:0;touch-action:none;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);}

  #topbar{position:absolute;top:0;left:0;right:0;padding:16px 20px;
    display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;
    background:linear-gradient(to bottom, rgba(20,24,28,.94), rgba(20,24,28,0));
    pointer-events:none;z-index:30;}
  #topbar h1{font-size:16px;margin:0;font-weight:600;pointer-events:auto;}
  #topbar .sub{color:var(--ink-dim);font-size:12.5px;margin-top:2px;pointer-events:auto;}

  #uploadBox{pointer-events:auto;display:flex;align-items:center;gap:8px;}
  .btn{background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
    padding:10px 14px;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:13.5px;
    font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;
    transition:border-color .15s, background .15s;}
  .btn:hover{border-color:var(--accent-dim);background:#283138;}
  .btn.active{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:600;}
  .btn .ic{font-family:'IBM Plex Mono',monospace;font-size:14px;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:600;}
  select#unitSelect{background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
    padding:9px 10px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}

  #toolbar{position:absolute;left:20px;bottom:20px;display:flex;gap:8px;flex-wrap:wrap;
    max-width:62%;z-index:20;}

  #panel{position:absolute;top:0;right:0;height:100%;width:330px;
    background:var(--bg-1);border-left:1px solid var(--line);
    padding:98px 22px 22px;overflow-y:auto;z-index:10;}
  #panel.panel-bottom{
    top:auto;left:0;right:0;bottom:0;height:auto;max-height:52%;width:100%;
    border-left:none;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;padding:18px 20px 24px;z-index:25;
    box-shadow:0 -8px 30px rgba(0,0,0,.4);
    transform:translateY(0);transition:transform .28s ease;}
  #panel.panel-bottom.panel-hidden{transform:translateY(105%);}
  .panel-close{position:absolute;top:14px;right:16px;width:28px;height:28px;border-radius:50%;
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;}
  #panel .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
  #panel h2{margin:0 0 18px;font-size:19px;font-weight:600;line-height:1.3;}
  #panel .empty{color:var(--ink-dim);font-size:13.5px;line-height:1.7;}
  .spec-row{border-top:1px solid var(--line);padding:12px 0;}
  .spec-row:first-of-type{border-top:none;}
  .spec-label{font-size:11.5px;color:var(--ink-dim);margin-bottom:5px;
    font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;}
  .spec-value{font-size:15px;font-weight:500;}
  .spec-value.mono{font-family:'IBM Plex Mono',monospace;color:var(--blue);}
  .spec-input{width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
    padding:8px 10px;border-radius:6px;font-family:'Sarabun',sans-serif;font-size:14px;}
  .spec-input:focus{outline:none;border-color:var(--accent-dim);}
  .chk-row{display:flex;align-items:center;gap:8px;font-size:13.5px;}
  .badge-no{display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;background:var(--accent);color:#1a1206;
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;margin-right:8px;flex:none;}

  #labelLayer{position:absolute;inset:0;pointer-events:none;z-index:6;}
  .lbl-num{position:absolute;transform:translate(-50%,-50%);
    width:22px;height:22px;border-radius:50%;background:rgba(224,138,60,.92);
    color:#1a1206;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;
    display:none;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px rgba(224,138,60,.22);}
  #dimSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:6;}
  #dimSvg line{stroke:var(--blue);stroke-width:1.4;}
  .lbl-overall{position:absolute;transform:translate(-50%,-50%);
    background:rgba(19,24,28,.92);border:1px solid var(--blue);
    color:var(--blue);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    padding:4px 9px;border-radius:5px;white-space:nowrap;letter-spacing:.02em;}

  #hint{position:absolute;bottom:20px;right:350px;color:var(--ink-dim);
    font-size:12px;font-family:'IBM Plex Mono',monospace;text-align:right;
    pointer-events:none;max-width:260px;z-index:15;}

  #toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);
    background:var(--bg-2);border:1px solid var(--warn);color:var(--ink);
    padding:12px 18px;border-radius:8px;font-size:13.5px;max-width:520px;
    line-height:1.6;display:none;z-index:40;}
  #toast b{color:var(--warn);}

  #linkModal{position:absolute;inset:0;background:rgba(10,12,14,.7);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  #linkModal .link-card{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;
    padding:22px;width:100%;max-width:480px;}
  #linkModal .spec-input{margin:10px 0 16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  #linkModal .link-actions{display:flex;gap:8px;justify-content:flex-end;}
</style>
</head>
<body>

<div id="scene"></div>
<div id="labelLayer"></div>
<svg id="dimSvg"></svg>
<div id="toast"></div>

<div id="topbar">
  <div>
    <h1 id="titleText">ตัวดูแบบชิ้นงาน — ตู้บิ้วอิน (ตัวอย่าง)</h1>
    <div class="sub eyebrow">ลาก = หมุน · scroll = ซูม · คลิกที่แผ่น = ดูรายละเอียด</div>
  </div>
  <div id="uploadBox">
    <select id="unitSelect" title="หน่วยของไฟล์ .obj ต้นฉบับ (ไม่มีผลกับ .glb/.gltf เพราะมาตรฐานกำหนดเป็นเมตรอยู่แล้ว)">
      <option value="1000">หน่วยไฟล์ .obj: เมตร (m)</option>
      <option value="10">หน่วยไฟล์ .obj: เซนติเมตร (cm)</option>
      <option value="1" selected>หน่วยไฟล์ .obj: มิลลิเมตร (mm)</option>
      <option value="25.4">หน่วยไฟล์ .obj: นิ้ว (inch)</option>
      <option value="304.8">หน่วยไฟล์ .obj: ฟุต (ft)</option>
    </select>
    <button class="btn primary" id="btnUpload"><span class="ic">↑</span> อัปโหลดไฟล์ .obj / .glb / .gltf</button>
    <input type="file" id="fileInput" accept=".obj,.glb,.gltf" style="display:none">
    <button class="btn" id="btnDemo"><span class="ic">⟲</span> ใช้ตัวอย่าง</button>
    <button class="btn" id="btnExportData"><span class="ic">⬇</span> ส่งออกข้อมูล (.json)</button>
    <button class="btn" id="btnImportData"><span class="ic">⬆</span> โหลดข้อมูล (.json)</button>
    <input type="file" id="dataFileInput" accept=".json" style="display:none">
    <button class="btn primary" id="btnCloudUpload"><span class="ic">☁</span> อัปโหลด .glb → สร้างลิงก์ทันที</button>
    <input type="file" id="cloudFileInput" accept=".glb" style="display:none">
    <button class="btn primary" id="btnCloudUploadData"><span class="ic">☁</span> รวมข้อมูล .json เข้ากับลิงก์</button>
  </div>
</div>

<div id="linkModal">
  <div class="link-card">
    <div class="tag">ลิงก์สำหรับส่งให้ลูกค้า/ช่าง</div>
    <input id="linkResultInput" class="spec-input" readonly>
    <div class="link-actions">
      <button class="btn primary" id="copyLinkBtn">คัดลอกลิงก์</button>
      <button class="btn" id="closeLinkModalBtn">ปิด</button>
    </div>
  </div>
</div>

<div id="toolbar">
  <button class="btn" id="btnExplode"><span class="ic">⇕</span> กางชิ้นงาน</button>
  <button class="btn" id="btnDoor"><span class="ic">▭</span> ซ่อน/แสดงบานประตู</button>
  <button class="btn" id="btnDims"><span class="ic">↔</span> แสดงระยะรวม</button>
  <button class="btn" id="btnNums"><span class="ic">#</span> แสดงเลขชิ้น</button>
  <button class="btn" id="btnReset"><span class="ic">⟲</span> มุมเริ่มต้น</button>
</div>

<div id="hint">คลิกพื้นที่ว่างเพื่อยกเลิกการเลือก</div>

<div id="panel">
  <div id="panelBody">
    <div class="tag">ข้อมูลชิ้นงาน</div>
    <div class="empty">คลิกที่แผ่นชิ้นงานในโมเดล เพื่อดูขนาด และกรอกวัสดุ/ผิว/ขอบของชิ้นนั้น</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* =================================================================
   SCENE / CAMERA / LIGHTS
================================================================= */
const container = document.getElementById('scene');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14181c);
scene.fog = new THREE.Fog(0x14181c, 2600, 20000);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 1, 50000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.85);
key.position.set(120, 180, 140);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fc8ff, 0.25);
fill.position.set(-140, 60, -100);
scene.add(fill);

let grid = new THREE.GridHelper(4000, 40, 0x2c3841, 0x212a31);
scene.add(grid);

/* custom orbit controls (no external deps) */
const controls = { target:new THREE.Vector3(0,0,0), radius:2600, theta:Math.PI*0.28, phi:Math.PI*0.42,
  dragging:false, lastX:0, lastY:0, moved:0 };
let DEFAULT_VIEW = { radius:2600, theta:Math.PI*0.28, phi:Math.PI*0.42, target:new THREE.Vector3(0,0,0) };
function applyCamera(){
  const r = controls.radius, th = controls.theta, ph = controls.phi;
  camera.position.set(
    controls.target.x + r*Math.sin(ph)*Math.sin(th),
    controls.target.y + r*Math.cos(ph),
    controls.target.z + r*Math.sin(ph)*Math.cos(th)
  );
  camera.lookAt(controls.target);
}
function resetView(){
  controls.radius = DEFAULT_VIEW.radius; controls.theta = DEFAULT_VIEW.theta; controls.phi = DEFAULT_VIEW.phi;
  controls.target.copy(DEFAULT_VIEW.target);
  applyCamera();
}
resetView();

renderer.domElement.style.touchAction = 'none'; // stop the phone's browser from hijacking drag/pinch as page scroll/zoom

const activePointers = new Map();
let lastPinchDist = null;
function pinchDist(){
  const pts = [...activePointers.values()];
  if (pts.length < 2) return null;
  return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
}

renderer.domElement.addEventListener('pointerdown', e=>{
  activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch(err){}
  if (activePointers.size === 1){
    controls.dragging = true; controls.moved = 0; controls.lastX = e.clientX; controls.lastY = e.clientY;
  } else if (activePointers.size === 2){
    controls.dragging = false;
    lastPinchDist = pinchDist();
  }
});
window.addEventListener('pointerup', e=>{
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) lastPinchDist = null;
  if (activePointers.size === 0){
    const wasDragging = controls.dragging;
    controls.dragging = false;
    if (wasDragging && controls.moved < 6) handlePick(e);
  } else if (activePointers.size === 1){
    // one finger lifted out of a pinch — resume single-finger rotate from the remaining finger
    const [ , p ] = [...activePointers.entries()][0];
    controls.dragging = true; controls.moved = 999; // 999 blocks an accidental click-pick right after a pinch
    controls.lastX = p.x; controls.lastY = p.y;
  }
});
window.addEventListener('pointercancel', e=>{
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) lastPinchDist = null;
  if (activePointers.size === 0) controls.dragging = false;
});
window.addEventListener('pointermove', e=>{
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if (activePointers.size === 2){
    const dist = pinchDist();
    if (lastPinchDist != null && dist != null){
      const delta = lastPinchDist - dist; // fingers moving apart = zoom in
      controls.radius = Math.min(30000, Math.max(200, controls.radius + delta*(controls.radius*0.004+1)));
      applyCamera();
    }
    lastPinchDist = dist;
    return;
  }
  if (!controls.dragging) return;
  const dx = e.clientX - controls.lastX, dy = e.clientY - controls.lastY;
  controls.moved += Math.abs(dx)+Math.abs(dy);
  controls.theta -= dx * 0.0055;
  controls.phi = Math.min(Math.PI*0.92, Math.max(0.12, controls.phi - dy*0.0055));
  controls.lastX = e.clientX; controls.lastY = e.clientY;
  applyCamera();
});
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  controls.radius = Math.min(30000, Math.max(200, controls.radius + e.deltaY*(controls.radius*0.0012+0.4)));
  applyCamera();
}, { passive:false });

/* =================================================================
   STATE
================================================================= */
const UNIT = 'มม.';
const EDIT_MODE = new URLSearchParams(location.search).get('edit') === '1';
const MODEL_SLUG = new URLSearchParams(location.search).get('model') || '';
const MODEL_DIR = MODEL_SLUG ? `./models/${encodeURIComponent(MODEL_SLUG)}/` : './';
const GLB_URL_PARAM = new URLSearchParams(location.search).get('glb') || '';
const DATA_URL_PARAM = new URLSearchParams(location.search).get('data') || '';

/* Cloudinary config — free account, "unsigned" upload preset.
   Fill these in once after creating your Cloudinary account, then
   the "อัปโหลด .glb → สร้างลิงก์ทันที" button works. */
const CLOUDINARY_CLOUD_NAME = 'jbors8bl';
const CLOUDINARY_UPLOAD_PRESET = 'gpoljagu';
let meshes = [];        // active THREE.Mesh list
let selected = null;
let exploded = false, explodeProgress = 0;
let doorsHidden = false;
let showNums = false, showDims = false;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const labelLayer = document.getElementById('labelLayer');
const dimSvg = document.getElementById('dimSvg');
const numEls = new Map();
let overallDims = []; // rebuilt per model

function clearScene(){
  meshes.forEach(m=>{ scene.remove(m); });
  numEls.forEach(el=>el.remove());
  numEls.clear();
  meshes = [];
  selected = null;
  selectPart(null);
}

/* =================================================================
   BUILD A PART (shared by demo boxes + uploaded OBJ groups)
   spec = { no, name, type, material, surface, edge, isDoor,
            geo (THREE.BufferGeometry, already centered on its own origin),
            basePos: THREE.Vector3 (world center), dimsMM:[w,h,d],
            explodeDir: THREE.Vector3, explodeDist:number, color:hex }
================================================================= */
function addPart(spec){
  const mat = new THREE.MeshStandardMaterial({ color:spec.color, roughness:0.75, metalness:0.02 });
  const mesh = new THREE.Mesh(spec.geo, mat);
  mesh.position.copy(spec.basePos);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(spec.geo),
    new THREE.LineBasicMaterial({ color:0x2a3238, transparent:true, opacity:0.5 }));
  mesh.add(edges);
  scene.add(mesh);
  mesh.userData = {
    no:spec.no, name:spec.name, type:spec.type, material:spec.material,
    surface:spec.surface, edge:spec.edge, isDoor:!!spec.isDoor,
    dimsMM:spec.dimsMM, basePos:spec.basePos.clone(),
    explodeDir:spec.explodeDir, explodeDist:spec.explodeDist,
  };
  meshes.push(mesh);

  const n = document.createElement('div');
  n.className = 'lbl-num';
  n.textContent = spec.no;
  labelLayer.appendChild(n);
  numEls.set(mesh, n);
  return mesh;
}

/* =================================================================
   OVERALL DIMENSION LINES — recomputed from current meshes' bbox
================================================================= */
function rebuildOverallDims(){
  overallDims.forEach(od=>{ od.lineEl.remove(); od.tick1.remove(); od.tick2.remove(); od.labelEl.remove(); });
  overallDims = [];
  if (!meshes.length) return;

  const box = new THREE.Box3();
  meshes.forEach(m=>{ box.expandByObject(m); });
  const size = new THREE.Vector3(); box.getSize(size);
  const min = box.min, max = box.max;
  const OFFSET = Math.max(60, size.length()*0.02);

  const defs = [
    { key:'w', label:'กว้าง', value:size.x,
      p1:[min.x, min.y-OFFSET, max.z+OFFSET], p2:[max.x, min.y-OFFSET, max.z+OFFSET] },
    { key:'h', label:'ยาว',  value:size.y,
      p1:[max.x+OFFSET, min.y, max.z+OFFSET], p2:[max.x+OFFSET, max.y, max.z+OFFSET] },
    { key:'d', label:'หนา',  value:size.z,
      p1:[max.x+OFFSET, min.y-OFFSET, min.z], p2:[max.x+OFFSET, min.y-OFFSET, max.z] },
  ];
  defs.forEach(od=>{
    od.lineEl = document.createElementNS('http://www.w3.org/2000/svg','line');
    od.tick1 = document.createElementNS('http://www.w3.org/2000/svg','line');
    od.tick2 = document.createElementNS('http://www.w3.org/2000/svg','line');
    dimSvg.appendChild(od.lineEl); dimSvg.appendChild(od.tick1); dimSvg.appendChild(od.tick2);
    od.labelEl = document.createElement('div');
    od.labelEl.className = 'lbl-overall';
    od.labelEl.textContent = `${od.label} ${od.value.toFixed(0)} ${UNIT}`;
    labelLayer.appendChild(od.labelEl);
    const disp = showDims ? '' : 'none';
    od.lineEl.style.display = disp; od.tick1.style.display = disp; od.tick2.style.display = disp;
    od.labelEl.style.display = showDims ? 'block' : 'none';
    overallDims.push(od);
  });

  // frame the camera around the new model
  const center = new THREE.Vector3(); box.getCenter(center);
  const dist = Math.max(size.length()*0.9, 600);
  DEFAULT_VIEW = { radius:dist, theta:Math.PI*0.28, phi:Math.PI*0.42, target:center.clone() };
  const gsize = Math.max(4000, size.length()*3);
  scene.remove(grid);
  grid = new THREE.GridHelper(gsize, 40, 0x2c3841, 0x212a31);
  grid.position.y = min.y - 5;
  grid.position.x = center.x; grid.position.z = center.z;
  scene.add(grid);
  resetView();
}

/* =================================================================
   DEMO CABINET (fallback / example)
================================================================= */
function buildDemoCabinet(){
  clearScene();
  document.getElementById('titleText').textContent = 'ตัวดูแบบชิ้นงาน — ตู้บิ้วอิน (ตัวอย่าง)';
  const W=900,H=2000,D=550,T=18;
  const defs = [
    { no:1, name:'แผ่นข้างซ้าย', type:'แผ่นข้าง (Side Panel)', material:'Particle Board 18 มม.',
      surface:'เมลามีนสีขาว', edge:'PVC 2 มม. สีขาว', size:[T,H,D],
      pos:[-(W/2-T/2),0,0], explodeDir:[-1,0,0], explodeDist:450, color:0xd8d3c8 },
    { no:2, name:'แผ่นข้างขวา', type:'แผ่นข้าง (Side Panel)', material:'Particle Board 18 มม.',
      surface:'เมลามีนสีขาว', edge:'PVC 2 มม. สีขาว', size:[T,H,D],
      pos:[(W/2-T/2),0,0], explodeDir:[1,0,0], explodeDist:450, color:0xd8d3c8 },
    { no:3, name:'แผ่นบน', type:'แผ่นบน/ล่าง (Top/Bottom Panel)', material:'Particle Board 18 มม.',
      surface:'เมลามีนสีขาว', edge:'PVC 2 มม. สีขาว', size:[W-2*T,T,D],
      pos:[0,H/2-T/2,0], explodeDir:[0,1,0], explodeDist:400, color:0xd8d3c8 },

/* =================================================================
   OBJ PARSER (minimal, dependency-free)
   Reads "o"/"g" as part boundaries, triangulates n-gon faces via fan.
================================================================= */
function parseOBJ(text, scaleToMM){
  const positions = [];
  const groups = [];
  function ensureGroup(name){
    let g = groups.find(g=>g.name===name);
    if (!g){ g = { name, tris:[] }; groups.push(g); }
    return g;
  }
  let current = ensureGroup('ชิ้นงาน');
  const lines = text.split('\n');
  for (let li=0; li<lines.length; li++){
    const line = lines[li].trim();
    if (!line || line[0]==='#') continue;
    const sp = line.indexOf(' ');
    if (sp === -1) continue;
    const tag = line.slice(0, sp);
    const rest = line.slice(sp+1).trim();
    if (tag === 'v'){
      const p = rest.split(/\s+/).map(Number);
      positions.push([p[0]*scaleToMM, p[1]*scaleToMM, p[2]*scaleToMM]);
    } else if (tag === 'o' || tag === 'g'){
      const name = rest || 'ชิ้นงาน';
      current = ensureGroup(name);
    } else if (tag === 'f'){
      const toks = rest.split(/\s+/);
      const idx = toks.map(tok=>{
        let vi = parseInt(tok.split('/')[0], 10);
        if (vi < 0) vi = positions.length + vi + 1;
        return vi - 1;
      });
      for (let i=1; i<idx.length-1; i++) current.tris.push([idx[0], idx[i], idx[i+1]]);
    }
  }
  return { positions, groups: groups.filter(g=>g.tris.length>0) };
}

function buildGeoFromGroup(positions, group){
  const arr = [];
  group.tris.forEach(tri=>{
    tri.forEach(vi=>{
      const p = positions[vi];
      if (!p) return;
      arr.push(p[0], p[1], p[2]);
    });
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const center = new THREE.Vector3(); bb.getCenter(center);
  geo.translate(-center.x, -center.y, -center.z);
  geo.computeVertexNormals();
  const size = new THREE.Vector3(); bb.getSize(size);
  return { geo, center, size };
}

const PALETTE = [0xd8d3c8,0xe4e0d5,0xcfc9bd,0xf1efe9,0xc9d6da,0xd6cfc0,0xdad2c3,0xc7d2c9];

/* shared: takes an array of {name, geo(centered), center(Vector3), size(Vector3)}
   and turns it into scene parts (radial explode dirs, numbering, overall dims). */
function finishLoadedParts(built, sourceLabel){
  if (!built.length){
    showToast('ไม่พบข้อมูลชิ้นงานที่อ่านได้ในไฟล์นี้');
    return;
  }
  clearScene();
  document.getElementById('titleText').textContent = 'ตัวดูแบบชิ้นงาน — ' + sourceLabel;

  const overallBox = new THREE.Box3();
  built.forEach(b=>{
    overallBox.expandByPoint(new THREE.Vector3().copy(b.center).sub(b.size.clone().multiplyScalar(0.5)));
    overallBox.expandByPoint(new THREE.Vector3().copy(b.center).add(b.size.clone().multiplyScalar(0.5)));
  });
  const overallCenter = new THREE.Vector3(); overallBox.getCenter(overallCenter);
  const overallSize = new THREE.Vector3(); overallBox.getSize(overallSize);
  const explodeUnit = Math.max(150, overallSize.length()*0.12);

  built.forEach((b, i)=>{
    const nameLower = (b.name||'').toLowerCase();
    const guessedDoor = nameLower.includes('door') || (b.name||'').includes('ประตู') || (b.name||'').includes('บาน');
    let dir = b.center.clone().sub(overallCenter);
    if (dir.lengthSq() < 1) dir = new THREE.Vector3(0,1,0);
    dir.normalize();
    addPart({
      no:i+1, name:b.name || ('ชิ้นงาน ' + (i+1)), type:'', material:'', surface:'', edge:'',
      isDoor:guessedDoor, geo:b.geo, basePos:b.center, dimsMM:[b.size.x,b.size.y,b.size.z],
      explodeDir:dir, explodeDist:explodeUnit, color:PALETTE[i % PALETTE.length],
    });
  });

  rebuildOverallDims();
  if (built.length === 1){
    showToast('ไฟล์นี้อ่านได้เป็น <b>ชิ้นเดียว</b> — ถ้าต้องการให้แยกเป็นรายแผ่น (คลิกดูทีละชิ้นได้) ' +
      'ต้องกลับไปที่ SketchUp แล้วตรวจสอบว่าแต่ละแผ่นเป็น Group/Component แยกกัน และตั้งชื่อไว้ก่อน export ใหม่');
  }
}

function loadOBJFile(text, scaleToMM){
  const parsed = parseOBJ(text, scaleToMM);
  const built = parsed.groups.map(g=>{
    const b = buildGeoFromGroup(parsed.positions, g);
    return { name:g.name, geo:b.geo, center:b.center, size:b.size };
  });
  finishLoadedParts(built, 'โมเดลที่อัปโหลด (.obj)');
}

function loadGLTFFile(arrayBuffer, isGlb){
  if (typeof THREE.GLTFLoader !== 'function'){
    showToast('โหลดตัวอ่านไฟล์ .glb/.gltf ไม่สำเร็จ (อาจเป็นเพราะอินเทอร์เน็ตของเครื่องนี้บล็อก cdn.jsdelivr.net) ' +
      'ลองรีเฟรชหน้าใหม่ หรือใช้ไฟล์ .obj แทนไปก่อนครับ');
    return;
  }
  const loader = new THREE.GLTFLoader();
  loader.parse(arrayBuffer, '', gltf=>{
    gltf.scene.updateMatrixWorld(true);
    const MM_PER_M = 1000; // glTF spec: base unit is always meters
    const scaleM = new THREE.Matrix4().makeScale(MM_PER_M, MM_PER_M, MM_PER_M);
    const built = [];
    gltf.scene.traverse(obj=>{
      if (!obj.isMesh || !obj.geometry) return;
      let name = obj.name;
      if (!name){
        let p = obj.parent;
        while (p && !name){ name = p.name; p = p.parent; }
      }
      const finalMatrix = scaleM.clone().multiply(obj.matrixWorld);
      const geo = obj.geometry.clone();
      geo.applyMatrix4(finalMatrix);
      geo.computeBoundingBox();
      const bb = geo.boundingBox;
      if (!isFinite(bb.min.x)) return;
      const center = new THREE.Vector3(); bb.getCenter(center);
      geo.translate(-center.x, -center.y, -center.z);
      geo.computeVertexNormals();
      const size = new THREE.Vector3(); bb.getSize(size);
      if (size.length() < 0.01) return; // skip degenerate/empty meshes
      built.push({ name, geo, center, size });
    });
    finishLoadedParts(built, 'โมเดลที่อัปโหลด (' + (isGlb?'.glb':'.gltf') + ')');
  }, err=>{
    console.error(err);
    showToast('เปิดไฟล์นี้ไม่สำเร็จ — ไฟล์อาจเสียหาย หรือถ้าเป็น .gltf ที่แยกไฟล์ .bin/รูปภาพไว้ต่างหาก ' +
      'ให้ลอง export เป็น <b>.glb</b> แบบไฟล์เดียวจบแทน จะเปิดได้แน่นอนกว่า');
  });
}

function handlePick(e){
  if (e.target !== renderer.domElement) return;
  pointer.x = (e.clientX/window.innerWidth)*2 - 1;
  pointer.y = -(e.clientY/window.innerHeight)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(meshes, false);
  selectPart(hits.length ? hits[0].object : null);
}

function escapeAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }

/* =================================================================
   RENDER LOOP
================================================================= */
function animate(){
  requestAnimationFrame(animate);

  explodeProgress += ((exploded?1:0) - explodeProgress) * 0.09;
  meshes.forEach(m=>{
    const d = m.userData;
    m.position.set(
      d.basePos.x + d.explodeDir.x*d.explodeDist*explodeProgress,
      d.basePos.y + d.explodeDir.y*d.explodeDist*explodeProgress,
      d.basePos.z + d.explodeDir.z*d.explodeDist*explodeProgress,
    );
  });

  meshes.forEach(m=>{
    const s = projectToScreen(worldPosOf(m));
    const num = numEls.get(m);
    if (showNums){
      num.style.display='flex'; num.style.left=s.x+'px'; num.style.top=s.y+'px';
      num.style.opacity = s.behind ? '0' : '1';
    }
  });

  if (showDims){
    overallDims.forEach(od=>{
      const v1 = new THREE.Vector3(...od.p1);
      const v2 = new THREE.Vector3(...od.p2);
      const s1 = projectToScreen(v1);
      const s2 = projectToScreen(v2);
      od.lineEl.setAttribute('x1', s1.x); od.lineEl.setAttribute('y1', s1.y);
      od.lineEl.setAttribute('x2', s2.x); od.lineEl.setAttribute('y2', s2.y);

      const dx = s2.x-s1.x, dy = s2.y-s1.y;
      const len = Math.hypot(dx,dy) || 1;
      const px = -dy/len*5, py = dx/len*5;
      od.tick1.setAttribute('x1', s1.x-px); od.tick1.setAttribute('y1', s1.y-py);
      od.tick1.setAttribute('x2', s1.x+px); od.tick1.setAttribute('y2', s1.y+py);
      od.tick2.setAttribute('x1', s2.x-px); od.tick2.setAttribute('y1', s2.y-py);
      od.tick2.setAttribute('x2', s2.x+px); od.tick2.setAttribute('y2', s2.y+py);

      const midX = (s1.x+s2.x)/2, midY = (s1.y+s2.y)/2;
      od.labelEl.style.left = midX+'px';
      od.labelEl.style.top = midY+'px';
      const hidden = s1.behind || s2.behind;
      od.lineEl.style.opacity = od.tick1.style.opacity = od.tick2.style.opacity = hidden?'0':'1';
      od.labelEl.style.opacity = hidden?'0':'1';
    });
  }

  renderer.render(scene, camera);
}

  const parts = meshes.map(m=>({
    no:m.userData.no, name:m.userData.name, type:m.userData.type,
    material:m.userData.material, surface:m.userData.surface,
    edge:m.userData.edge, isDoor:m.userData.isDoor,
  }));
  const blob = new Blob([JSON.stringify({ parts }, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'data.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('ดาวน์โหลด <b>data.json</b> แล้ว — เอาไฟล์นี้ไป commit ขึ้น GitHub คู่กับ index.html ' +
    'หน้าเว็บสาธารณะจะโหลดค่านี้มาแสดงให้คนอื่นดูอัตโนมัติ');
}
function applyDataJSON(json){
  if (!json || !Array.isArray(json.parts)) return;
  const byNo = new Map(json.parts.map(p=>[p.no, p]));
  meshes.forEach(m=>{
    const p = byNo.get(m.userData.no);
    if (!p) return;
    ['name','type','material','surface','edge'].forEach(f=>{
      if (typeof p[f] === 'string') m.userData[f] = p[f];
    });
    if (typeof p.isDoor === 'boolean') m.userData.isDoor = p.isDoor;
    const numEl = numEls.get(m);
    if (numEl) numEl.title = m.userData.name;
  });
}

document.getElementById('btnExportData').addEventListener('click', exportDataJSON);
document.getElementById('btnImportData').addEventListener('click', ()=> document.getElementById('dataFileInput').click());
document.getElementById('dataFileInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try { applyDataJSON(JSON.parse(ev.target.result)); showToast('โหลดข้อมูลจาก JSON เรียบร้อย'); }
    catch(err){ showToast('ไฟล์ JSON นี้เปิดไม่ได้ ตรวจสอบรูปแบบไฟล์อีกครั้ง'); }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
});

/* =================================================================
   INIT — three ways a model can load, tried in this order:
   1) ?glb=<direct URL>  (+ optional &data=<direct URL to data.json>)
      — a permanent link generated by "อัปโหลด .glb → สร้างลิงก์ทันที"
        (e.g. a Cloudinary URL). No GitHub folder needed at all.
   2) ?model=SLUG — looks inside ./models/SLUG/ for that project's
      model + data.json (the GitHub-folder-per-project approach)
        yoursite.github.io/repo/?model=aa-01
   3) no params — falls back to the root folder (single-project
      setup), then to the demo cabinet if nothing is found — this
      also covers opening the file locally by double-click, where
      fetch() of local files is blocked by the browser and simply
      fails quietly.
================================================================= */
async function init(){
  if (GLB_URL_PARAM){
    try {
      const res = await fetch(GLB_URL_PARAM);
      if (res.ok){
        loadGLTFFile(await res.arrayBuffer(), true);
        if (DATA_URL_PARAM){
          try {
            const r2 = await fetch(DATA_URL_PARAM);
            if (r2.ok) applyDataJSON(await r2.json());
          } catch(e){}
        }
        return;
      }
      showToast('เปิดลิงก์โมเดลนี้ไม่สำเร็จ (โหลดไฟล์ไม่ได้) — ลิงก์อาจไม่ถูกต้องหรือไฟล์ถูกลบไปแล้ว');
    } catch(e){
      showToast('เปิดลิงก์โมเดลนี้ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต หรือลิงก์อาจไม่ถูกต้อง');
    }
  }

  let loaded = false;
  try {
    const res = await fetch(MODEL_DIR + 'model.glb');
    if (res.ok){ loadGLTFFile(await res.arrayBuffer(), true); loaded = true; }
  } catch(e){}
  if (!loaded){
    try {
      const res = await fetch(MODEL_DIR + 'model.obj');
      if (res.ok){ loadOBJFile(await res.text(), 1); loaded = true; }
    } catch(e){}
  }
  if (!loaded && MODEL_SLUG){
    showToast(`ยังไม่พบไฟล์โมเดลสำหรับ <b>${escapeHtml(MODEL_SLUG)}</b> — ตรวจสอบว่ามี ` +
      `<b>models/${escapeHtml(MODEL_SLUG)}/model.glb</b> (หรือ .obj) อยู่ใน repo แล้ว`);
  }
  if (!loaded) buildDemoCabinet();

  try {
    const res = await fetch(MODEL_DIR + 'data.json');
    if (res.ok) applyDataJSON(await res.json());
  } catch(e){}
}
/* =================================================================
   CLOUD UPLOAD — upload a .glb straight to Cloudinary (free, unsigned
   preset) and get back a permanent public URL, then build a
   ready-to-send share link using ?glb=<url> (see init() above).
   No GitHub editing needed for this path at all.
================================================================= */
let lastGlbCloudUrl = ''; // remembered so the data.json button can combine into one link
function currentShareLink(dataUrl){
  let link = `${location.origin}${location.pathname}?glb=${encodeURIComponent(lastGlbCloudUrl)}`;
  if (dataUrl) link += `&data=${encodeURIComponent(dataUrl)}`;
  return link;
}
function showLinkModal(link){
  document.getElementById('linkResultInput').value = link;
  document.getElementById('linkModal').style.display = 'flex';
}
document.getElementById('closeLinkModalBtn').addEventListener('click', ()=>{
  document.getElementById('linkModal').style.display = 'none';
});
document.getElementById('copyLinkBtn').addEventListener('click', async ()=>{
  const inp = document.getElementById('linkResultInput');
  inp.select();
  try { await navigator.clipboard.writeText(inp.value); showToast('คัดลอกลิงก์แล้ว'); }
  catch(e){ document.execCommand('copy'); showToast('คัดลอกลิงก์แล้ว'); }
});

function cloudinaryReady(){
  if (CLOUDINARY_CLOUD_NAME.startsWith('YOUR_') || CLOUDINARY_UPLOAD_PRESET.startsWith('YOUR_')){
    showToast('ยังไม่ได้ตั้งค่า Cloudinary ในไฟล์นี้ — ใส่ Cloud name และ Upload preset ในโค้ดก่อนใช้ปุ่มนี้');
    return false;
  }
  return true;
}

document.getElementById('btnCloudUpload').addEventListener('click', ()=>{
  if (!cloudinaryReady()) return;
  document.getElementById('cloudFileInput').click();
});
document.getElementById('cloudFileInput').addEventListener('change', async e=>{
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  showToast('กำลังอัปโหลดขึ้นคลาวด์ อาจใช้เวลาสักครู่ตามขนาดไฟล์...');
  try {
    // preview locally right away, same File object is still readable
    loadGLTFFile(await file.arrayBuffer(), true);
  } catch(e){}

  try {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/raw/upload`, {
      method:'POST', body:form,
    });
    const json = await res.json();
    if (!res.ok || !json.secure_url) throw new Error((json.error && json.error.message) || 'upload failed');
    lastGlbCloudUrl = json.secure_url;
    showLinkModal(currentShareLink());
    showToast('อัปโหลดโมเดลสำเร็จ — ถ้ากรอกข้อมูลชิ้นงานเสร็จแล้ว กดปุ่ม "รวมข้อมูล .json เข้ากับลิงก์" เพื่อรวมเข้าลิงก์เดียวกัน');
  } catch(err){
    console.error(err);
    showToast('อัปโหลดขึ้นคลาวด์ไม่สำเร็จ: ' + (err.message || 'ไม่ทราบสาเหตุ'));
  }
});

document.getElementById('btnCloudUploadData').addEventListener('click', async ()=>{
  if (!cloudinaryReady()) return;
  if (!lastGlbCloudUrl){
    showToast('ยังไม่ได้อัปโหลดโมเดล .glb ขึ้นคลาวด์เลย — กด "อัปโหลด .glb → สร้างลิงก์ทันที" ก่อนหนึ่งครั้ง');
    return;
  }
  if (!meshes.length){
    showToast('ยังไม่มีชิ้นงานให้ส่งออกข้อมูล — โหลดโมเดลก่อน');
    return;
  }
  showToast('กำลังอัปโหลดข้อมูลชิ้นงานขึ้นคลาวด์...');
  try {
    const parts = meshes.map(m=>({
      no:m.userData.no, name:m.userData.name, type:m.userData.type,
      material:m.userData.material, surface:m.userData.surface,
      edge:m.userData.edge, isDoor:m.userData.isDoor,
    }));
    const blob = new Blob([JSON.stringify({ parts }, null, 2)], { type:'application/json' });
    const form = new FormData();
    form.append('file', blob, 'data.json');
    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/raw/upload`, {
      method:'POST', body:form,
    });
    const json = await res.json();
    if (!res.ok || !json.secure_url) throw new Error((json.error && json.error.message) || 'upload failed');
    showLinkModal(currentShareLink(json.secure_url));
    showToast('รวมข้อมูลเข้ากับลิงก์เรียบร้อย — ลิงก์นี้ตอนนี้มีทั้งโมเดลและข้อมูลชิ้นงานครบแล้ว');
  } catch(err){
    console.error(err);
    showToast('อัปโหลดข้อมูลไม่สำเร็จ: ' + (err.message || 'ไม่ทราบสาเหตุ'));
  }
});

init();
</script>
</body>
</html>
